<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BenMillard</title>
    <style>
        ul li{
            float: left;
        }
        li a{
            display:block;
            padding: 8px 15px;
            background-color: white;
            text-decoration: none;
            color: black;
        }
        li a:hover {
            background-color: grey;
            color: white;
        }
        h1 a{
            text-decoration: none;
            color:black;
        }

        img{
            display: block;
            width: 100%;
        }
        .top{
            display: flex;

            flex-direction: column;
        }
        .header{
            display: flex;
            justify-content: center;
            width: 50%;
        }

            display: flex;
            width: 50%;
            justify-content: center;
            align-items: center;
        }

        .buckets{
            display: flex;
        }

        .main{
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .god{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
        }
        .jesus{
            width: 30%;
        }
        .gallery{
            margin-left:15%;
        }

        @media (max-width: 600px){
            .header{
                display: flex;
                justify-content: center;
                width: 75%;
            }
            .title{
                font-size: 2em;
                width: 100%;
            }
            li{
                font-size:medium;
            }

            .god{
                flex-direction: column;
            }

            .jesus{
                width: 70%;
            }
        }
    </style>
</head>
